name: CI

on:
  push:
    # tim: this fork's integration branch (fork-only change).
    branches: [master, tim]
  pull_request:
    branches: [master]

jobs:
  # Fail on any byte-compiler warning.  Pinned to one release: the
  # snapshot obsoletes things without notice.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '31.1'

      - name: Install Cask
        uses: conao3/setup-cask@master
        with:
          version: 'snapshot'

      - name: Install Elisp dependencies
        run: cask install

      - name: Byte-compile without warnings
        run: make lint

  test-ubuntu:
    runs-on: ubuntu-latest
    # The snapshot breaks things (currently Cask itself) without
    # notice; report it, but don't fail the run for it.
    continue-on-error: ${{ matrix.emacs-version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - '26.3'
          - '27.2'
          - '28.2'
          - '29.4'
          - 'snapshot'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Cask
        uses: conao3/setup-cask@master
        with:
          version: 'snapshot'

      - name: Install server build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make automake autoconf gcc g++ \
            libpng-dev libpoppler-glib-dev libpoppler-private-dev \
            libz-dev pkg-config qpdf

      - name: Compile epdfinfo server
        run: make autobuild

      - name: Install Elisp dependencies
        run: cask install

      - name: Run tests
        run: make test

  # Run the tests against an epdfinfo built with AddressSanitizer and
  # UndefinedBehaviorSanitizer, so memory errors and leaks fail CI.
  test-asan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '29.4'

      - name: Install Cask
        uses: conao3/setup-cask@master
        with:
          version: 'snapshot'

      - name: Install server build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make automake autoconf gcc g++ \
            libpng-dev libpoppler-glib-dev libpoppler-private-dev \
            libz-dev pkg-config qpdf

      - name: Compile epdfinfo server
        run: make autobuild

      - name: Install Elisp dependencies
        run: cask install

      - name: Run tests under the sanitizers
        run: make test-asan

      - name: Upload sanitizer reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: asan-logs
          path: asan-logs/

  test-macos:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '29.4'

      - name: Install Cask
        uses: conao3/setup-cask@master
        with:
          version: 'snapshot'

      - name: Install server build dependencies
        run: |
          brew install automake autoconf poppler pkg-config gnu-sed qpdf
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> $GITHUB_PATH

      - name: Compile epdfinfo server
        run: make autobuild

      - name: Install Elisp dependencies
        run: cask install

      - name: Run tests
        run: make test

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            autoconf
            automake
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-imagemagick
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-emacs

      - name: Install Cask
        run: git clone https://github.com/cask/cask ~/.cask

      - name: Compile epdfinfo server
        run: |
          export PATH="$HOME/.cask/bin:$PATH"
          make autobuild

      - name: Package Windows binaries
        run: |
          mkdir -p pack
          cp server/epdfinfo.exe pack/
          ldd server/epdfinfo.exe | grep ucrt64 | cut -d' ' -f3 | xargs -I {} cp {} pack/
          cp /ucrt64/bin/libcrypto*.dll pack/ || true
          cp /ucrt64/bin/libssl*.dll pack/ || true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: epdfinfo-ucrt64
          path: pack/